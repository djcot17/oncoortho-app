<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>OncoOrtho Mobile v0.1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef4f7;color:#18364c;margin:0;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}.card{max-width:760px;margin:24px auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 14px #0001}h1{margin:.2em 0}.tag{display:inline-block;background:#e8f5f7;color:#087087;border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px}input,button{font:inherit;box-sizing:border-box;width:100%;padding:13px;margin:6px 0;border-radius:12px;border:1px solid #cbd9e1}button{background:#0b7489;color:#fff;font-weight:700;border:0}.secondary{background:#eaf1f4;color:#17384d}.patient{border:1px solid #d6e3e9;border-radius:13px;padding:13px;margin:10px 0}.hidden{display:none}.muted{color:#687d8b;font-size:14px}.error{color:#a12727}</style></head><body><main class="card"><span class="tag">SOLO LECTURA</span><h1>OncoOrtho Mobile</h1><p class="muted">Prototipo v0.1 para validar la apertura de una copia móvil cifrada generada por el Mac. Datos ficticios únicamente.</p><section id="gate"><input id="file" type="file" accept=".json,application/json"><input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña de OncoOrtho"><button id="open">Abrir copia móvil</button><p id="msg" class="muted">Selecciona el archivo <b>oncoortho-mobile-…json</b>.</p></section><section id="app" class="hidden"><h2 id="count"></h2><div id="list"></div><button id="lock" class="secondary">Bloquear</button></section><p class="muted">Esta versión no puede crear, editar ni borrar pacientes y no envía datos por red.</p></main><script>
const $=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder();let bundle=null,plain=null;
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFor(pass,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt'])}
async function decrypt(box,pass){if(!['oncoortho-demo-v3','oncoortho-demo-v2'].includes(box?.format))throw Error('Formato cifrado no válido');const key=await keyFor(pass,unb64(box.salt)),data=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},key,unb64(box.data));return JSON.parse(dec.decode(data))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('file').onchange=async e=>{bundle=null;$('msg').textContent='Leyendo copia…';try{const f=e.target.files?.[0];if(!f)throw Error();const b=JSON.parse(await f.text());if(b?.format!=='oncoortho-mobile-readonly-v1'||b?.mode!=='readonly'||!b?.keyring?.passwordWrap||!b?.clinical||!b?.images)throw Error();bundle=b;$('msg').textContent='Copia móvil reconocida. Introduce la contraseña.'}catch{$('msg').textContent='El archivo seleccionado no es una copia móvil válida.'}};
$('open').onclick=async()=>{if(!bundle)return $('msg').textContent='Selecciona primero la copia móvil.';if(!$('pw').value)return $('msg').textContent='Introduce la contraseña.';try{const {dek}=await decrypt(bundle.keyring.passwordWrap,$('pw').value);const db=await decrypt(bundle.clinical,dek);if(!Array.isArray(db))throw Error();const m=bundle.manifest||{};if(Number(m.patients)!==db.length)throw Error();plain=db;$('count').textContent=db.length+' pacientes';$('list').innerHTML=db.map(p=>'<div class="patient"><b>'+esc(p.code||'Sin código')+'</b></div>').join('');$('pw').value='';$('gate').classList.add('hidden');$('app').classList.remove('hidden')}catch{$('msg').textContent='No se ha podido abrir la copia: contraseña incorrecta o archivo alterado.'}};
$('lock').onclick=()=>{plain=null;bundle=null;$('list').innerHTML='';$('file').value='';$('app').classList.add('hidden');$('gate').classList.remove('hidden');$('msg').textContent='Selecciona de nuevo la copia móvil.'};
</script></body></html>
